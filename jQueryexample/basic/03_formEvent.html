<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../css/03_formEvent.css">
</head>
<body>
    <h2>회원가입</h2>
        <form name="join" id="join">
            <div>
                <div class="menu"><label for="user_id">아이디</label></div><input type="text" name="user_id" id="user_id" />
            </div>
            <div>
                <div class="menu"><label for="user_pw">비밀번호</label></div><input type="text" name="user_pw" id="user_pw" />
            </div>
            <div>
                <div class="menu"><label for="user_name">이름</label></div><input type="text" name="user_name" id="user_name" />
            </div>
            <div>
                <div class="menu"><label for="birth">생년월일</label></div><input type="text" name="birth" id="birth" />
            </div>
            <div>
                <div class="menu"><label for="gender">성별</label></div>
                <input type="radio" name="gender" value="남자">남자
                <input type="radio" name="gender" value="여자">여자
            </div>
            <div>
                <div class="menu"><label for="email">이메일</label></div>
                <input type="text" name="email" id="email" />@
                <input type="text" name="emailDomain" id="emailDomain">
                <select name="emailAddress" id="emailAddress">
                    <option value="">선택</option>
                    <option value="네이버">naver.com</option>
                    <option value="다음">daum.net</option>
                    <option value="구글">gmail.com</option>
                </select>
            </div>
            <div>
                <div class="menu"><label for="hpno">핸드폰번호</label></div>
                <input type="number" name="hpno" id="hpno" placeholder="- 빼고 입력"/>
            </div>
            <div>
                <div class="menu"><label for="hobby">취미<input type="checkbox" name="hobby" id="hobby"></label></div>
                <input type="checkbox" name="hobby" class="hobby_check" value="걷기"><div class="menu"><label>걷기</label></div>
                <input type="checkbox" name="hobby" class="hobby_check" value="축구"><div class="menu"><label>축구</label></div>
                <input type="checkbox" name="hobby" class="hobby_check" value="농구"><div class="menu"><label>농구</label></div>
                <input type="checkbox" name="hobby" class="hobby_check" value="야구"><div class="menu"><label>야구</label></div>
                <input type="checkbox" name="hobby" class="hobby_check" value="여행"><div class="menu"><label>여행</label></div>
                <input type="checkbox" name="hobby" class="hobby_check" value="여행"><div class="menu"><label>여행</label></div>
            </div>
            <div>
                <div class="menu"><label for="job">직업</label></div>
                <select name="job" id="job">
                    <option value="">-----선택하세요-----</option>
                    <option value="프로그래머">프로그래머</option>
                    <option value="퍼블리셔">퍼블리셔</option>
                    <option value="디자이너">디자이너</option>
                    <option value="기획자">기획자</option>
                    <option value="학생">학생</option>
                </select>
            </div>
            <div>
                <button type="button" id="sign_up">회원가입</button>
                <button type="reset">다시작성</button>
            </div>
        </form>




    <script src="../js/jquery-3.7.1.min.js"></script>
    <script src="../js/03_formEvent.js"></script>
</body>
</html>
